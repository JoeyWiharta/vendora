<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Vendora" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Vendora</title>
  <defs>
    <clipPath id="planet"><circle cx="256" cy="256" r="188"/></clipPath>
  </defs>
  <g fill="none" stroke-linecap="butt">
    <!-- orbit ring (full, behind planet) -->
    <g transform="rotate(-20 256 256)">
      <ellipse cx="256" cy="256" rx="236" ry="86" stroke="#5252DB" stroke-width="26"/>
    </g>
  </g>
  <!-- planet -->
  <circle cx="256" cy="256" r="188" fill="#5252DB"/>
  <!-- V (symmetric) -->
  <polygon fill="#fff" points="152,128 218,128 256,206 294,128 360,128 256,338"/>
  <!-- front ring: blue gap + white band, only inside planet -->
  <g clip-path="url(#planet)" fill="none">
    <g transform="rotate(-20 256 256)">
      <path d="M20 256 A236 86 0 0 0 492 256" stroke="#5252DB" stroke-width="52"/>
      <path d="M20 256 A236 86 0 0 0 492 256" stroke="#fff" stroke-width="22"/>
    </g>
  </g>
</svg>
